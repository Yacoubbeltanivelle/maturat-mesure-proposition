<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maturat Mesure · proposition d’accueil</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Maquette d’accueil pour Maturat Mesure, distribution et conseil en instrumentation à Martigues.">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="preload" href="assets/fonts/instrument-sans-500.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body data-pack="E">
  <span id="haut"></span>
  <a class="skip" href="#contenu">Aller au contenu</a>

  <header class="site-header">
    <div class="banner">
      <p><span data-t="site.banner"></span> <a href="#limites" data-banner-link data-t="site.bannerLink"></a></p>
    </div>
    <div class="bar">
      <a class="brand" href="#haut" aria-label="Maturat Mesure, accueil">
        <img src="assets/maturat-logo.png" alt="Maturat Mesure" width="1107" height="324">
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
      <nav class="nav" id="menu" aria-label="Navigation principale">
        <ul data-nav></ul>
        <a class="btn btn--primary btn--sm" href="#contact" data-t="site.cta"></a>
      </nav>
    </div>
  </header>

  <main id="contenu">
    <!-- 1. Hero -->
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero__grain" aria-hidden="true"></div>
      <div class="wrap hero__grid">
        <div class="hero__copy">
          <h1 id="hero-title" data-t="hero.title"></h1>
          <p class="lede" data-t="hero.text"></p>
          <div class="actions">
            <a class="btn btn--primary" href="#solutions" data-t="hero.primary"></a>
            <a class="btn btn--text" href="#contact" data-t="hero.secondary"></a>
          </div>
          <div class="univers" role="group" aria-labelledby="univers-label">
            <p class="univers__label" id="univers-label" data-t="hero.indexLabel"></p>
            <ul class="univers__list" data-univers></ul>
          </div>
        </div>
        <div class="tray-wrap">
          <ul class="tray" data-tray></ul>
          <p class="tray-note" data-t="hero.trayNote"></p>
        </div>
      </div>
    </section>

    <!-- 2. Solutions -->
    <section class="section section--pale" id="solutions" aria-labelledby="solutions-title">
      <div class="wrap">
        <div class="section-head">
          <h2 id="solutions-title" data-t="solutions.title"></h2>
          <p data-t="solutions.intro"></p>
        </div>

        <div class="search">
          <label for="search" data-t="solutions.searchLabel"></label>
          <div class="search__row">
            <input id="search" type="search" autocomplete="off" spellcheck="false" maxlength="80">
            <button class="btn btn--quiet btn--sm" type="button" data-search-clear hidden></button>
          </div>
        </div>

        <div class="explorer">
          <ul class="families" data-families></ul>
          <div class="panel" data-panel></div>
        </div>
        <p class="context-line" data-context-line></p>
        <p class="sr" role="status" data-live></p>
      </div>
    </section>

    <!-- 3. Dropout -->
    <section class="section section--deep" id="dropout" aria-labelledby="dropout-title">
      <div class="wrap dropout">
        <div class="dropout__stage">
          <div class="dropout__photo" data-dropout-photo></div>
          <div class="flow" role="img" data-flow>
            <span class="flow__pipe"></span>
          </div>
        </div>
        <div class="dropout__copy">
          <h2 id="dropout-title" data-t="dropout.title"></h2>
          <p class="lede" data-t="dropout.intro"></p>
          <div class="toggle" role="group" aria-label="Besoin ou principe" data-dropout-toggle></div>
          <div class="dropout__text" aria-live="polite">
            <h3 data-dropout-title></h3>
            <p data-dropout-text></p>
          </div>
          <div class="actions">
            <button class="btn btn--primary" type="button" data-dropout-open></button>
          </div>
          <p class="fineprint" data-t="dropout.note"></p>
        </div>
      </div>
    </section>

    <!-- 4. Applications -->
    <section class="section" id="applications" aria-labelledby="apps-title">
      <div class="wrap">
        <div class="section-head">
          <h2 id="apps-title" data-t="applications.title"></h2>
          <p data-t="applications.intro"></p>
        </div>
        <div class="sectors">
          <div class="sector-list" role="group" aria-label="Secteurs" data-sectors></div>
          <div class="sector-body" data-sector-body></div>
        </div>
      </div>
    </section>

    <!-- 5. Conseil -->
    <section class="section section--pale" id="conseil" aria-labelledby="conseil-title">
      <div class="wrap">
        <div class="section-head">
          <h2 id="conseil-title" data-t="conseil.title"></h2>
          <p data-t="conseil.intro"></p>
        </div>
        <ul class="situations" data-situations></ul>
      </div>
    </section>

    <!-- 6. Entreprise -->
    <section class="section" id="entreprise" aria-labelledby="entreprise-title">
      <div class="wrap company">
        <div>
          <h2 id="entreprise-title" data-t="entreprise.title"></h2>
          <p class="lede" data-t="entreprise.text"></p>
          <dl class="facts" data-facts></dl>
        </div>
        <div class="overlay" aria-hidden="true" data-overlay></div>
      </div>
    </section>

    <!-- 7. FAQ -->
    <section class="section section--pale" id="faq" aria-labelledby="faq-title">
      <div class="wrap faq-wrap">
        <h2 id="faq-title" data-t="faq.title"></h2>
        <div class="faq" data-faq></div>
      </div>
    </section>

    <!-- 8. Contact -->
    <section class="section" id="contact" aria-labelledby="contact-title">
      <div class="wrap contact">
        <div class="contact__intro">
          <h2 id="contact-title" data-t="contact.title"></h2>
          <p data-t="contact.intro"></p>
          <div class="context-box" data-context-box></div>
        </div>
        <div class="contact__form">
          <form novalidate data-form>
            <p class="required-note" data-t="contact.required"></p>
            <div class="field" data-field="name">
              <label for="f-name">Nom <span class="req" aria-hidden="true">*</span></label>
              <input id="f-name" name="name" type="text" autocomplete="name" required aria-describedby="e-name">
              <p class="error" id="e-name" hidden></p>
            </div>
            <div class="field" data-field="email">
              <label for="f-email">Adresse e-mail <span class="req" aria-hidden="true">*</span></label>
              <input id="f-email" name="email" type="email" autocomplete="email" required aria-describedby="e-email">
              <p class="error" id="e-email" hidden></p>
            </div>
            <div class="field" data-field="company">
              <label for="f-company">Entreprise (facultatif)</label>
              <input id="f-company" name="company" type="text" autocomplete="organization">
            </div>
            <fieldset class="extra" data-extra hidden></fieldset>
            <div class="field" data-field="message">
              <label for="f-message">Votre besoin <span class="req" aria-hidden="true">*</span></label>
              <textarea id="f-message" name="message" rows="5" required aria-describedby="h-message e-message"></textarea>
              <p class="hint" id="h-message"></p>
              <p class="error" id="e-message" hidden></p>
            </div>
            <button class="btn btn--primary" type="submit" data-t="contact.submit"></button>
          </form>

          <div class="summary" data-summary hidden tabindex="-1">
            <h3 data-t="contact.summaryTitle"></h3>
            <p data-t="contact.summaryText"></p>
            <dl class="facts" data-summary-list></dl>
            <button class="btn btn--quiet" type="button" data-summary-edit data-t="contact.summaryEdit"></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="limites">
    <div class="wrap">
      <div class="footer-row">
        <p class="footer-brand" data-t="footer.lead"></p>
        <ul class="footer-nav" data-footer-nav></ul>
        <p class="footer-mention" data-t="footer.mention"></p>
      </div>
      <div class="footer-bottom">
        <button class="btn btn--quiet btn--sm" type="button" data-info-open="credits" data-t="footer.creditsButton"></button>
        <button class="btn btn--quiet btn--sm" type="button" data-info-open="about" data-t="footer.aboutButton"></button>
        <button class="btn btn--quiet btn--sm" type="button" data-reset data-t="footer.resetLabel"></button>
        <p class="status" role="status" data-reset-status></p>
      </div>
    </div>
  </footer>

  <dialog class="card-dialog" data-dialog aria-labelledby="dialog-title">
    <div class="dialog-body" data-dialog-body></div>
  </dialog>
  <dialog class="card-dialog" data-info-dialog aria-labelledby="info-title">
    <div class="dialog-body" data-info-body></div>
  </dialog>
</body>
</html>
